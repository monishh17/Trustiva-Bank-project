<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustiva Bank - Create Account</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="form-page">

    <main class="account-form">

        <div class="form-header">
            <img src="../assets/images/logo.png" alt="Trustiva Bank logo">
            <h1>Create Your Trustiva Bank Account</h1>
            <p>Fill in the details below to create your new bank account.</p>
        </div>

        <form id="createAccountForm" novalidate>

            <section class="form-section">
                <h2>Personal Information</h2>

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select your gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </section>

            <section class="form-section">
                <h2>Contact Information</h2>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="10-digit phone number" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>

                <label for="state">State</label>
                <input type="text" id="state" name="state" placeholder="Enter your state" required>

                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" required>

                <label for="pincode">PIN Code</label>
                <input type="text" id="pincode" name="pincode" placeholder="6-digit PIN code" inputmode="numeric" required>
            </section>

            <section class="form-section">
                <h2>Account Information</h2>

                <label for="accountType">Account Type</label>
                <select id="accountType" name="accountType" required>
                    <option value="">Select account type</option>
                    <option value="Savings">Savings Account</option>
                    <option value="Current">Current Account</option>
                </select>

                <label for="username">Create Username</label>
                <input type="text" id="username" name="username" placeholder="Create a username" autocomplete="username" required>
                <p class="field-hint">3-30 characters: letters, numbers, dots, dashes, underscores.</p>

                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>

                <label for="confirmPassword">Re-enter Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>

                <label for="initialDeposit">Initial Deposit (optional)</label>
                <input type="number" id="initialDeposit" name="initialDeposit" min="0" step="0.01" placeholder="Enter initial deposit amount">
            </section>

            <section class="form-section">
                <h2>Nominee Information</h2>

                <label for="nomineeName">Nominee Name</label>
                <input type="text" id="nomineeName" name="nomineeName" placeholder="Enter nominee name" required>

                <label for="nomineeRelation">Relationship with Account Holder</label>
                <input type="text" id="nomineeRelation" name="nomineeRelation" placeholder="Example: Father, Mother, Spouse" required>
            </section>

            <p class="form-message" id="createAccountMessage"></p>

            <button type="submit" class="btn-submit" id="createAccountButton">Create Account</button>
        </form>

        <a class="link back-login" href="../index.html">Back to Login</a>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/create-account.js"></script>
</body>
</html>
