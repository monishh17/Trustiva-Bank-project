<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustiva Bank - Withdraw</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="app-page">

    <header class="page-header">
        <img src="../assets/images/logo.png" alt="Trustiva Bank logo">
        <h1>Trustiva Bank</h1>
    </header>

    <main class="panel">
        <h1>Withdraw Money</h1>
        <p class="panel-info">Available balance: <strong id="withdrawBalance">₹0</strong></p>

        <form id="withdrawForm" novalidate>
            <label for="withdrawAmount">Amount</label>
            <input class="money-input" type="number" id="withdrawAmount" min="1" step="0.01" placeholder="Enter amount">

            <button type="submit" class="btn btn-dark" id="withdrawButton">Withdraw</button>
        </form>

        <p class="form-message" id="withdrawMessage"></p>
        <a class="btn btn-light" href="dashboard.html">Back to Dashboard</a>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/withdraw.js"></script>
</body>
</html>
