<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustiva Bank - Forgot Password</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">

    <main class="auth-card">
        <div class="brand">
            <img src="../assets/images/logo.png" alt="Trustiva Bank logo">
            <h1>Trustiva Bank</h1>
        </div>

        <h2>Forgot Password?</h2>
        <p class="subtitle">Confirm your details to set a new password</p>

        <form id="forgotPasswordForm" novalidate>
            <div class="input-box">
                <span class="icon">👤</span>
                <input type="text" id="forgotUsername" placeholder="Username" autocomplete="username">
            </div>

            <div class="input-box">
                <span class="icon">📱</span>
                <input type="tel" id="phone" placeholder="Registered phone number">
            </div>

            <div class="input-box">
                <span class="icon">🎂</span>
                <input type="date" id="dob" aria-label="Date of birth">
            </div>

            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" id="newPassword" placeholder="New password (8+ characters)" autocomplete="new-password">
            </div>

            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" id="confirmNewPassword" placeholder="Confirm new password" autocomplete="new-password">
            </div>

            <p class="form-message" id="forgotPasswordMessage"></p>

            <button type="submit" class="btn btn-accent" id="resetPasswordButton">Reset Password</button>
        </form>

        <p class="or-text">or</p>

        <a class="link" href="../index.html">Back to Login</a>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/pages/forgot-password.js"></script>
</body>
</html>
